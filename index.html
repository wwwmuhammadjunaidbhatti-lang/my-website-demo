
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Base64 XML Demo</title>
</head>
<body>
  <h1>Base64 XML Demo</h1>
  <p id="status">Checking URL data...</p>
  <p id="title"></p>
  <p id="destination"></p>

  <script>
    const status = document.getElementById("status");
    const titleOutput = document.getElementById("title");
    const destinationOutput = document.getElementById("destination");

    try {
      const params = new URLSearchParams(window.location.search);
      const encoded = params.get("xml");

      if (!encoded) {
        status.textContent = "No Base64 XML found in URL.";
      } else {
        const decoded = atob(encoded);
        const xml = new DOMParser().parseFromString(
          decoded,
          "application/xml"
        );

        if (xml.querySelector("parsererror")) {
          throw new Error("The decoded data is not valid XML.");
        }

        const title = xml.querySelector("title")?.textContent;
        const destination =
          xml.querySelector("destination")?.textContent;

        status.textContent = "Base64 XML loaded successfully!";
        titleOutput.textContent = "Title: " + (title || "Not provided");
        destinationOutput.textContent =
          "Destination: " + (destination || "Not provided");
      }
    } catch (error) {
      status.textContent = "Error: " + error.message;
    }
  </script>
</body>
</html>
