
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Website Demo</title>
  <meta name="description" content="My first HTML website demo.">
</head>
<body>
  <h1>My Website Demo</h1>
  <p>Website successfully uploaded.</p>
  <p id="message">Loading configuration...</p>

  <script>
    fetch("https://raw.githubusercontent.com/wwwmuhammadjunaidbhatti-lang/my-website-demo/refs/heads/main/config.xml")
      .then(response => {
        if (!response.ok) {
          throw new Error("HTTP error: " + response.status);
        }
        return response.text();
      })
      .then(data => {
        const cleanedData = data
          .replace(/^\uFEFF/, "")
          .replace(/^\s*<\?xml[^?]*\?>/i, "");

        const xml = new DOMParser().parseFromString(
          cleanedData,
          "application/xml"
        );

        const parseError = xml.querySelector("parsererror");

        if (parseError) {
          console.error("XML parsing details:", parseError.textContent);
          throw new Error("XML parsing failed. Check Console for details.");
        }

        const title = xml.querySelector("title");

        document.getElementById("message").textContent =
          title ? title.textContent : "Configuration loaded.";
      })
      .catch(error => {
        document.getElementById("message").textContent = error.message;
        console.error(error);
      });
  </script>
</body>
</html>
