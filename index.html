<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading...</title>
</head>
<body style="font-family: Arial, sans-serif; max-width: 550px; margin: 40px auto; padding: 0 15px; text-align: center;">

  <!-- 1. VISITOR VIEW (Sirf tab dikhega jab URL mein ?xml= hoga) -->
  <div id="visitorView" style="display: none; padding: 30px 20px; border: 1px solid #ddd; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
    <h1 id="visitorTitle" style="margin-top: 0; color: #333;">Welcome</h1>
    <p style="color: #666; margin-bottom: 25px;">Click the button below to continue to your destination.</p>
    <a id="visitBtn" href="#" style="display: inline-block; padding: 12px 28px; background: #007bff; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 16px;">
      Continue to Website →
    </a>
  </div>

  <!-- ERROR MESSAGE (Agar XML galat ho) -->
  <p id="errorBox" style="display: none; color: red; font-weight: bold;"></p>

  <!-- 2. ADMIN / GENERATOR VIEW (Sirf tab dikhega jab normal website khulegi) -->
  <div id="generatorView" style="display: none; text-align: left;">
    <h1>Base64 XML Link Generator</h1>
    <p>Neeche box mein apna <strong>Title</strong> aur <strong>Destination</strong> likhein aur button dabayein:</p>

    <textarea id="xmlInput" rows="6" style="width: 100%; font-family: monospace; padding: 10px; box-sizing: border-box;"><config>
  <title>My New Website</title>
  <destination>https://www.wikipedia.org/</destination>
</config></textarea>

    <br><br>
    <button id="generateBtn" style="padding: 10px 18px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">
      Generate Base64 URL
    </button>

    <div id="resultBox" style="display: none; margin-top: 20px; padding: 15px; background: #f4f4f4; border-radius: 6px; word-break: break-all;">
      <p style="margin-top: 0;"><strong>Aapka Ready URL:</strong></p>
      <p id="generatedUrl" style="font-family: monospace; font-size: 13px;"></p>
      <p style="margin-bottom: 0;">
        <a id="testLink" href="#" target="_blank" style="color: #007bff; font-weight: bold;">
          👉 Click here to test this URL (Opens in new tab)
        </a>
      </p>
    </div>
  </div>

  <script>
    const visitorView = document.getElementById("visitorView");
    const generatorView = document.getElementById("generatorView");
    const errorBox = document.getElementById("errorBox");
    const visitorTitle = document.getElementById("visitorTitle");
    const visitBtn = document.getElementById("visitBtn");

    try {
      const params = new URLSearchParams(window.location.search);
      const encoded = params.get("xml");

      if (!encoded) {
        // Agar URL mein ?xml= nahi hai, toh Generator dikhao
        document.title = "XML Link Generator";
        generatorView.style.display = "block";
      } else {
        // Agar URL mein ?xml= hai, toh decode karke Visitor Page dikhao
        const base64 = encoded.replace(/-/g, "+").replace(/_/g, "/");
        const padded = base64 + "=".repeat((4 - base64.length % 4) % 4);
        const decoded = atob(padded);

        const bytes = Uint8Array.from(decoded, c => c.charCodeAt(0));
        const xmlText = new TextDecoder().decode(bytes);

        const cleanedXml = xmlText
          .replace(/^\uFEFF/, "")
          .replace(/^\s*<\?xml[^?]*\?>/i, "");

        const xml = new DOMParser().parseFromString(cleanedXml, "application/xml");

        if (xml.querySelector("parsererror")) {
          throw new Error("The decoded data is not valid XML.");
        }

        const title = xml.querySelector("title")?.textContent?.trim() || "Welcome";
        const destination = xml.querySelector("destination")?.textContent?.trim();

        if (!destination) {
          throw new Error("Destination URL is missing in XML.");
        }

        document.title = title;
        visitorTitle.textContent = title;
        visitBtn.href = destination;
        visitorView.style.display = "block";
      }
    } catch (error) {
      errorBox.textContent = "Error: " + error.message;
      errorBox.style.display = "block";
    }

    // Generator Button ka kaam
    document.getElementById("generateBtn").addEventListener("click", () => {
      const xmlText = document.getElementById("xmlInput").value.trim();
      const bytes = new TextEncoder().encode(xmlText);
      let binary = "";
      bytes.forEach(b => binary += String.fromCharCode(b));

      const base64Url = btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");

      const fullUrl = window.location.origin + window.location.pathname + "?xml=" + base64Url;

      document.getElementById("generatedUrl").textContent = fullUrl;
      document.getElementById("testLink").href = fullUrl;
      document.getElementById("resultBox").style.display = "block";
    });
  </script>
</body>
</html>
